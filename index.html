<style>
:root{--bg:#ebe5d8;--ink:#2b2824;--mute:#6b6458;--teal:#0f5a5c;--on:#fff;--warn:#b4402c;--late:#b4402c;--line:rgba(110,92,62,.22);
--out:6px 6px 14px rgba(150,130,98,.38),-6px -6px 14px rgba(255,255,255,.85);
--sm:3px 3px 8px rgba(150,130,98,.35),-3px -3px 8px rgba(255,255,255,.85);
--in:inset 3px 3px 7px rgba(150,130,98,.38),inset -3px -3px 7px rgba(255,255,255,.85);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#242220;--ink:#ece6d9;--mute:#a69e90;--teal:#1f7d7f;--warn:#ef8a70;--late:#c4513a;--line:rgba(255,255,255,.12);
--out:6px 6px 14px rgba(0,0,0,.55),-6px -6px 14px rgba(255,255,255,.04);--sm:3px 3px 8px rgba(0,0,0,.55),-3px -3px 8px rgba(255,255,255,.04);--in:inset 3px 3px 7px rgba(0,0,0,.55),inset -3px -3px 7px rgba(255,255,255,.05);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#242220;--ink:#ece6d9;--mute:#a69e90;--teal:#1f7d7f;--warn:#ef8a70;--late:#c4513a;--line:rgba(255,255,255,.12);
--out:6px 6px 14px rgba(0,0,0,.55),-6px -6px 14px rgba(255,255,255,.04);--sm:3px 3px 8px rgba(0,0,0,.55),-3px -3px 8px rgba(255,255,255,.04);--in:inset 3px 3px 7px rgba(0,0,0,.55),inset -3px -3px 7px rgba(255,255,255,.05);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:22px 18px 80px}
.hero{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:28px;background:var(--bg);box-shadow:var(--out)}
.avw{position:relative;flex:none}
.av{position:relative;display:grid;place-items:center;width:68px;height:68px;padding:0;border:0;border-radius:50%;font:800 28px "Plus Jakarta Sans",system-ui,sans-serif;background:var(--teal) center/cover no-repeat;color:var(--on);cursor:pointer;box-shadow:var(--sm),inset 0 0 0 3px rgba(255,255,255,.18)}
.av::after{content:"+";position:absolute;right:-3px;bottom:-3px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-size:17px;font-weight:800;box-shadow:var(--sm)}
.avx{position:absolute;left:-4px;top:-4px;width:22px;height:22px;padding:0;border:0;border-radius:50%;background:var(--bg);color:var(--warn);font:800 14px/1 sans-serif;cursor:pointer;box-shadow:var(--sm)}
.avx[hidden]{display:none}
.who{min-width:0}
.hero .dots,.hero .sq,.stripe,.slogan .chk{display:none}
h1{margin:0;font-size:clamp(30px,8.5vw,40px);line-height:1.05;font-weight:800;letter-spacing:-.03em}
h1 .hi{display:block;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--mute);margin-bottom:2px}
.slogan{display:inline-block;margin:6px 0 0;padding:7px 16px;border-radius:99px;box-shadow:var(--in);color:var(--mute)}
.slogan b{font-size:12px;font-weight:700;letter-spacing:.1em}
.sub{display:inline-block;margin:8px 0 0;padding:4px 12px;border-radius:99px;box-shadow:var(--in);color:var(--mute);font-weight:600;font-size:13px}
nav{display:flex;gap:6px;padding:6px;margin:18px 0 22px;border-radius:18px;box-shadow:var(--in)}
nav button{flex:1;font:700 15px inherit;font-family:inherit;color:var(--mute);background:none;border:0;border-radius:13px;padding:11px 6px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--teal);color:var(--on);box-shadow:var(--sm)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.card{background:var(--bg);border-radius:24px;padding:20px;margin-bottom:22px;box-shadow:var(--out)}
section.card>.row>b{font-size:19px;font-weight:800;letter-spacing:-.01em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:8px}
.mute{color:var(--mute);font-size:14px;font-weight:600}
.bar{height:14px;border-radius:99px;box-shadow:var(--in);overflow:hidden;margin:14px 0 8px;padding:3px}
.bar i{display:block;height:100%;min-width:0;background:linear-gradient(90deg,var(--teal),#2a9496);border-radius:99px;transition:width .4s}
.eta{margin-top:14px;padding:12px 14px;border-radius:14px;box-shadow:var(--in);font-weight:600;font-size:15px}
input,select{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:0;border-radius:13px;box-shadow:var(--in);padding:12px 14px;min-width:0}
::placeholder{color:var(--mute);font-weight:500;opacity:.85}
input[type=number]{width:120px}
input.grow{flex:1;min-width:140px}
.btn{font:700 14px inherit;font-family:inherit;color:var(--ink);background:var(--bg);border:0;border-radius:99px;box-shadow:var(--sm);padding:11px 20px;cursor:pointer}
.btn:active{box-shadow:var(--in)}
.btn.pri{background:var(--teal);color:var(--on)}
.btn.pri:active{box-shadow:inset 3px 3px 7px rgba(0,0,0,.35)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.del{color:var(--warn)}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1.5px solid var(--line)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:none;margin:0;padding:0;border-radius:9px;background:var(--bg);box-shadow:var(--sm);cursor:pointer;display:grid;place-content:center}
.item input[type=checkbox]:checked{background:var(--teal);box-shadow:var(--in)}
.item input[type=checkbox]:checked::after{content:"";width:11px;height:6px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.item .t{flex:1;min-width:0}
.item .t b{font-size:16px;font-weight:700}
.item.done .t b{text-decoration:line-through;color:var(--mute)}
.tag{font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;margin-right:5px;background:var(--bg);color:var(--ink);box-shadow:var(--sm)}
.tag.late{background:var(--late);color:#fff}
.tag.lec{background:var(--teal);color:var(--on)}
.empty{color:var(--mute);text-align:center;padding:28px 12px;border:2px dashed var(--line);border-radius:24px;margin-bottom:22px;font-weight:600}
.log{margin-top:10px;font-size:13px;color:var(--mute)}
.log div{display:flex;justify-content:space-between;padding:3px 0}
.neg{color:var(--warn)}
details summary{cursor:pointer;color:var(--ink);font-weight:700;font-size:14px;margin-top:12px}
.eta b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em}
.eta span{display:block;margin-top:3px;font-size:13px;font-weight:600;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 6px 16px;margin:-6px -6px 0}
.chip{flex:none;font:700 13px inherit;font-family:inherit;color:var(--ink);background:var(--bg);border:0;border-radius:99px;box-shadow:var(--sm);padding:8px 14px;cursor:pointer;white-space:nowrap}
.chip i{font-style:normal;margin-left:4px;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--teal);color:var(--on);box-shadow:var(--in)}
.chip[aria-pressed="true"] i{color:var(--on);opacity:.85}
.sec{font-size:19px;font-weight:800;letter-spacing:-.01em}
.tgl{margin-left:auto;flex:none;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:var(--bg);color:var(--ink);box-shadow:var(--sm);display:grid;place-items:center;cursor:pointer}
.tgl:active{box-shadow:var(--in)}
.editf{padding:12px 0;border-bottom:1.5px solid var(--line)}
.editf:last-child{border-bottom:0}
.item .btn.sm{padding:6px 11px}
.sv{padding:14px 0;border-bottom:1.5px solid var(--line)}
.sv:last-child{border-bottom:0}
.bar.mini{height:10px;padding:2px;margin:10px 0}
#toast{display:flex;align-items:center;gap:16px;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:50;width:max-content;max-width:min(92vw,420px);padding:14px 20px;border-radius:20px;background:var(--bg);color:var(--ink);box-shadow:var(--out);transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast b{display:block;font-weight:800;font-size:16px}
#toast span{display:block;margin-top:2px;color:var(--mute);font-size:14px;font-weight:600}
#toast.celebrate{background:var(--teal);color:#fff}
#toast.celebrate span{color:#fff;opacity:.9}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:49;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.note{margin-top:3px;font-size:13px;font-weight:500;color:var(--mute)}
.tbtn{flex:none;font:700 13px inherit;font-family:inherit;border:0;border-radius:99px;padding:8px 16px;background:var(--teal);color:#fff;cursor:pointer}
#toast.celebrate .tbtn{background:#fff;color:#0f5a5c}
#nameov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(20,18,14,.5)}
#nameov[hidden]{display:none}
#nameov .card{width:min(100%,380px);margin:0}
#hname{cursor:pointer}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
#gate{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:var(--bg);overflow-y:auto}
#gate[hidden],html[data-auth="1"] #gate{display:none}
.gcard{width:min(100%,400px);margin:0;text-align:center}
.glogo{display:block;margin:0 auto 14px;width:84px;height:84px;border-radius:24px;box-shadow:var(--out)}
.gname{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:0 0 8px}
.gstack{display:grid;gap:12px}
#gate input{width:100%}
#gate .btn{width:100%;padding:14px 20px;font-size:15px}
.foot{margin-top:30px;text-align:center}
.foot a{color:var(--mute);font-weight:700;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<script>
(function(){
var KEY="mygoals.v1", tab="today", editId=null;
var S={goals:[],school:[],errands:[]};
try{var raw=localStorage.getItem(KEY); if(raw){var p=JSON.parse(raw); if(p&&p.goals) S=p;}}catch(e){}
function setSync(t){var el=document.getElementById("sync"); if(el)el.textContent=t;}
function save(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} idbSet("state",S); pushCloud();}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function kes(n){return "KES "+Math.round(n).toLocaleString("en-KE")}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayIso(){return iso(new Date())}
function fmtDate(s){if(!s)return"";var d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}
document.getElementById("today").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

function eta(g){
  var rem=g.target-g.saved;
  if(rem<=0)return ["Goal reached!","You did it. Time to celebrate."];
  if(!g.monthly||g.monthly<=0)return ["Set how much you save","Add an amount to see your finish date."];
  var wk=g.period==="week", n=Math.ceil(rem/g.monthly);
  var d=new Date(); if(wk)d.setDate(d.getDate()+n*7); else d.setMonth(d.getMonth()+n);
  var span=wk?(n+(n>1?" weeks":" week")):(n>=12?(Math.floor(n/12)+" yr"+(n%12?" "+n%12+" mo":"")):(n+(n>1?" months":" month")));
  var opt={day:"numeric",month:"short"}; if(d.getFullYear()!==new Date().getFullYear())opt.year="numeric";
  var l1=span+" to go. Done by "+d.toLocaleDateString("en-GB",opt)+".", l2;
  if(g.deadline){
    var dl=new Date(g.deadline+"T00:00:00");
    if(d>dl){var left=Math.max(1,Math.ceil((dl-new Date())/(wk?604800000:2629800000)));l2="Save "+kes(Math.ceil(rem/left))+(wk?" a week":" a month")+" to hit your deadline.";}
    else l2="On track. Keep going!";
  } else {
    var p=g.saved/g.target*100;
    l2=p>=75?"Almost there!":p>=50?"Over halfway!":p>=25?"Building momentum.":"Great start. Every deposit counts.";
  }
  return [l1,l2];
}
function etaHtml(g){var e=eta(g);return "<b>"+esc(e[0])+"</b>"+(e[1]?"<span>"+esc(e[1])+"</span>":"")}

function savingsView(){
  var h='<form class="card" data-form="goal"><div class="row"><input class="grow" name="name" placeholder="Goal name (e.g. Laptop)" required>'+
  '<input type="number" name="target" placeholder="Target KES" min="1" required><input type="number" name="monthly" placeholder="Amount to save" min="0"><select name="period" aria-label="Saving period"><option value="week">per week</option><option value="month">per month</option></select>'+
  '<input type="date" name="deadline" title="Deadline (optional)"><button class="btn pri">Add goal</button></div></form>';
  if(!S.goals.length)h+='<div class="empty">No savings goals yet. Add one above to start tracking.</div>';
  S.goals.forEach(function(g){
    if(editId===g.id){h+=goalEditForm(g);return;}
    var pct=Math.max(0,Math.min(100,g.saved/g.target*100));
    h+='<section class="card" data-id="'+g.id+'"><div class="row sp"><b>'+esc(g.name)+'</b><span class="row"><button class="btn sm" data-act="edit">Edit</button><button class="btn sm del" data-act="delgoal">Delete</button></span></div>'+
    '<div class="big">'+kes(g.saved)+'</div><div class="mute">of '+kes(g.target)+' ('+Math.round(pct)+'%)</div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="eta">'+etaHtml(g)+'</div>'+

function digest(S,now){
  var t=iso(now),parts=[];
  var sc=S.school.filter(function(x){return!x.done&&x.kind!=="lecture"}),er=S.errands.filter(function(x){return!x.done});
  var dS=sc.filter(function(x){return x.when===t}),dE=er.filter(function(x){return x.due===t});
  var late=sc.filter(function(x){return x.when<t}).length+er.filter(function(x){return x.due&&x.due<t}).length;
  if(dS.length)parts.push(dS.map(function(x){return({cat:"CAT: ",exam:"Exam: "}[x.kind]||"Due: ")+x.title}).join(", "));
  if(dE.length)parts.push("Errands: "+dE.map(function(x){return x.title}).join(", "));
  if(late)parts.push(late+" overdue");
  var day=now.getDay(),dom=now.getDate();
  var nudge=S.goals.filter(function(g){return g.monthly>0&&g.saved<g.target&&((g.period==="week"&&day===1)||(g.period!=="week"&&dom===1))});
  if(nudge.length)parts.push("Time to save: "+nudge.map(function(g){return kes(g.monthly)+" for "+g.name}).join(", "));
  return parts.join(". ");
}
