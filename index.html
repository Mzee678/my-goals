<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timely</title>
<meta name="theme-color" content="#ebe5d8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timely">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ebe5d8;--ink:#2b2824;--mute:#6b6458;--teal:#0f5a5c;--on:#fff;--warn:#b4402c;--late:#b4402c;--line:rgba(110,92,62,.22);
--out:6px 6px 14px rgba(150,130,98,.38),-6px -6px 14px rgba(255,255,255,.85);
--sm:3px 3px 8px rgba(150,130,98,.35),-3px -3px 8px rgba(255,255,255,.85);
--in:inset 3px 3px 7px rgba(150,130,98,.38),inset -3px -3px 7px rgba(255,255,255,.85);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#242220;--ink:#ece6d9;--mute:#a69e90;--teal:#1f7d7f;--warn:#ef8a70;--late:#c4513a;--line:rgba(255,255,255,.12);
--out:6px 6px 14px rgba(0,0,0,.55),-6px -6px 14px rgba(255,255,255,.04);--sm:3px 3px 8px rgba(0,0,0,.55),-3px -3px 8px rgba(255,255,255,.04);--in:inset 3px 3px 7px rgba(0,0,0,.55),inset -3px -3px 7px rgba(255,255,255,.05);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#242220;--ink:#ece6d9;--mute:#a69e90;--teal:#1f7d7f;--warn:#ef8a70;--late:#c4513a;--line:rgba(255,255,255,.12);
--out:6px 6px 14px rgba(0,0,0,.55),-6px -6px 14px rgba(255,255,255,.04);--sm:3px 3px 8px rgba(0,0,0,.55),-3px -3px 8px rgba(255,255,255,.04);--in:inset 3px 3px 7px rgba(0,0,0,.55),inset -3px -3px 7px rgba(255,255,255,.05);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:22px 18px 80px}
.hero{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:28px;background:var(--bg);box-shadow:var(--out)}
.avw{position:relative;flex:none}
.av{position:relative;display:grid;place-items:center;width:68px;height:68px;padding:0;border:0;border-radius:50%;font:800 28px "Plus Jakarta Sans",system-ui,sans-serif;background:var(--teal) center/cover no-repeat;color:var(--on);cursor:pointer;box-shadow:var(--sm),inset 0 0 0 3px rgba(255,255,255,.18)}
.av::after{content:"+";position:absolute;right:-3px;bottom:-3px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-size:17px;font-weight:800;box-shadow:var(--sm)}
.avx{position:absolute;left:-4px;top:-4px;width:22px;height:22px;padding:0;border:0;border-radius:50%;background:var(--bg);color:var(--warn);font:800 14px/1 sans-serif;cursor:pointer;box-shadow:var(--sm)}
.avx[hidden]{display:none}
.who{min-width:0}
.hero .dots,.hero .sq,.stripe,.slogan .chk{display:none}
h1{margin:0;font-size:clamp(30px,8.5vw,40px);line-height:1.05;font-weight:800;letter-spacing:-.03em}
h1 .hi{display:block;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--mute);margin-bottom:2px}
.slogan{display:inline-block;margin:6px 0 0;padding:7px 16px;border-radius:99px;box-shadow:var(--in);color:var(--mute)}
.slogan b{font-size:12px;font-weight:700;letter-spacing:.1em}
.sub{display:inline-block;margin:8px 0 0;padding:4px 12px;border-radius:99px;box-shadow:var(--in);color:var(--mute);font-weight:600;font-size:13px}
nav{display:flex;gap:6px;padding:6px;margin:18px 0 22px;border-radius:18px;box-shadow:var(--in)}
nav button{flex:1;font:700 15px inherit;font-family:inherit;color:var(--mute);background:none;border:0;border-radius:13px;padding:11px 6px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--teal);color:var(--on);box-shadow:var(--sm)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.card{background:var(--bg);border-radius:24px;padding:20px;margin-bottom:22px;box-shadow:var(--out)}
section.card>.row>b{font-size:19px;font-weight:800;letter-spacing:-.01em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:8px}
.mute{color:var(--mute);font-size:14px;font-weight:600}
.bar{height:14px;border-radius:99px;box-shadow:var(--in);overflow:hidden;margin:14px 0 8px;padding:3px}
.bar i{display:block;height:100%;min-width:0;background:linear-gradient(90deg,var(--teal),#2a9496);border-radius:99px;transition:width .4s}
.eta{margin-top:14px;padding:12px 14px;border-radius:14px;box-shadow:var(--in);font-weight:600;font-size:15px}
input,select{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:0;border-radius:13px;box-shadow:var(--in);padding:12px 14px;min-width:0}
::placeholder{color:var(--mute);font-weight:500;opacity:.85}
input[type=number]{width:120px}
input.grow{flex:1;min-width:140px}
.btn{font:700 14px inherit;font-family:inherit;color:var(--ink);background:var(--bg);border:0;border-radius:99px;box-shadow:var(--sm);padding:11px 20px;cursor:pointer}
.btn:active{box-shadow:var(--in)}
.btn.pri{background:var(--teal);color:var(--on)}
.btn.pri:active{box-shadow:inset 3px 3px 7px rgba(0,0,0,.35)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.del{color:var(--warn)}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1.5px solid var(--line)}
.item:last-child{border-bottom:0}
.item input[type=checkbox]{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:none;margin:0;padding:0;border-radius:9px;background:var(--bg);box-shadow:var(--sm);cursor:pointer;display:grid;place-content:center}
.item input[type=checkbox]:checked{background:var(--teal);box-shadow:var(--in)}
.item input[type=checkbox]:checked::after{content:"";width:11px;height:6px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.item .t{flex:1;min-width:0}
.item .t b{font-size:16px;font-weight:700}
.item.done .t b{text-decoration:line-through;color:var(--mute)}
.tag{font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;margin-right:5px;background:var(--bg);color:var(--ink);box-shadow:var(--sm)}
.tag.late{background:var(--late);color:#fff}
.tag.lec{background:var(--teal);color:var(--on)}
.empty{color:var(--mute);text-align:center;padding:28px 12px;border:2px dashed var(--line);border-radius:24px;margin-bottom:22px;font-weight:600}
.log{margin-top:10px;font-size:13px;color:var(--mute)}
.log div{display:flex;justify-content:space-between;padding:3px 0}
.neg{color:var(--warn)}
details summary{cursor:pointer;color:var(--ink);font-weight:700;font-size:14px;margin-top:12px}
.eta b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em}
.eta span{display:block;margin-top:3px;font-size:13px;font-weight:600;color:var(--mute)}
.foot{margin-top:30px;text-align:center}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <header class="hero"><div class="avw"><button type="button" class="av" id="av" aria-label="Change profile picture"><span id="avt">E</span></button><button type="button" class="avx" id="avx" aria-label="Remove profile picture" hidden>×</button><input type="file" id="avf" accept="image/*" hidden></div><div class="who"><h1><span class="hi">Welcome</span>Eric</h1><p class="sub" id="today"></p></div></header>
  
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="savings" aria-selected="true">Savings</button>
    <button role="tab" data-tab="school" aria-selected="false">School</button>
    <button role="tab" data-tab="errands" aria-selected="false">Errands</button>
  </nav>
  <div id="view"></div>
  <div class="stripe"></div>
  <div class="row"><button class="btn" id="exp" style="flex:1">Export</button><button class="btn" id="impb" style="flex:1">Import</button><input type="file" id="imp" accept="application/json,.json" hidden></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="rem" style="flex:1">Reminders: off</button><input type="time" id="remt" value="08:00" aria-label="Reminder time" style="width:130px"></div>
  <p class="mute" id="remnote" style="margin:8px 0 0;font-size:13px"></p>
<footer class="foot"><p class="slogan"><span class="chk"></span><b>PLAN. SAVE. REPEAT.</b></p></footer>
</main>
<script>
(function(){
var KEY="mygoals.v1", tab="savings";
var S={goals:[],school:[],errands:[]};
try{var raw=localStorage.getItem(KEY); if(raw){var p=JSON.parse(raw); if(p&&p.goals) S=p;}}catch(e){}
var dbr=null, pushT=null;
function setSync(t){var el=document.getElementById("sync"); if(el)el.textContent=t;}
function save(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} idbSet("state",S); pushCloud();}
function pushCloud(){
  if(!dbr)return;
  clearTimeout(pushT);
  pushT=setTimeout(function(){
    var snap=JSON.parse(JSON.stringify(S));
    dbr.set(snap).then(function(){setSync("Synced to your account");}).catch(function(){setSync("Saved on this device. Cloud sync failed, it will retry on your next change.");});
  },500);
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function kes(n){return "KES "+Math.round(n).toLocaleString("en-KE")}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayIso(){return iso(new Date())}
function fmtDate(s){if(!s)return"";var d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}
document.getElementById("today").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

function eta(g){
  var rem=g.target-g.saved;
  if(rem<=0)return ["Goal reached!","You did it. Time to celebrate."];
  if(!g.monthly||g.monthly<=0)return ["Set how much you save","Add an amount to see your finish date."];
  var wk=g.period==="week", n=Math.ceil(rem/g.monthly);
  var d=new Date(); if(wk)d.setDate(d.getDate()+n*7); else d.setMonth(d.getMonth()+n);
  var span=wk?(n+(n>1?" weeks":" week")):(n>=12?(Math.floor(n/12)+" yr"+(n%12?" "+n%12+" mo":"")):(n+(n>1?" months":" month")));
  var opt={day:"numeric",month:"short"}; if(d.getFullYear()!==new Date().getFullYear())opt.year="numeric";
  var l1=span+" to go. Done by "+d.toLocaleDateString("en-GB",opt)+".", l2;
  if(g.deadline){
    var dl=new Date(g.deadline+"T00:00:00");
    if(d>dl){var left=Math.max(1,Math.ceil((dl-new Date())/(wk?604800000:2629800000)));l2="Save "+kes(Math.ceil(rem/left))+(wk?" a week":" a month")+" to hit your deadline.";}
    else l2="On track. Keep going!";
  } else {
    var p=g.saved/g.target*100;
    l2=p>=75?"Almost there!":p>=50?"Over halfway!":p>=25?"Building momentum.":"Great start. Every deposit counts.";
  }
  return [l1,l2];
}
function etaHtml(g){var e=eta(g);return "<b>"+esc(e[0])+"</b>"+(e[1]?"<span>"+esc(e[1])+"</span>":"")}

function savingsView(){
  var h='<form class="card" data-form="goal"><div class="row"><input class="grow" name="name" placeholder="Goal name (e.g. Laptop)" required>'+
  '<input type="number" name="target" placeholder="Target KES" min="1" required><input type="number" name="monthly" placeholder="Amount to save" min="0"><select name="period" aria-label="Saving period"><option value="week">per week</option><option value="month">per month</option></select>'+
  '<input type="date" name="deadline" title="Deadline (optional)"><button class="btn pri">Add goal</button></div></form>';
  if(!S.goals.length)h+='<div class="empty">No savings goals yet. Add one above to start tracking.</div>';
  S.goals.forEach(function(g){
    var pct=Math.max(0,Math.min(100,g.saved/g.target*100));
    h+='<section class="card" data-id="'+g.id+'"><div class="row sp"><b>'+esc(g.name)+'</b><button class="btn sm del" data-act="delgoal">Delete</button></div>'+
    '<div class="big">'+kes(g.saved)+'</div><div class="mute">of '+kes(g.target)+' ('+Math.round(pct)+'%)</div>'+
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="eta">'+etaHtml(g)+'</div>'+
    '<form class="row" data-form="tx" style="margin-top:12px"><input type="number" name="amt" placeholder="Amount" min="1" required><input class="grow" name="note" placeholder="Note (optional)">'+
    '<button class="btn pri" data-kind="add">Add</button><button class="btn" data-kind="sub">Deduct</button></form>'+
    '<div class="row" style="margin-top:10px"><span class="mute">Saving plan:</span><input type="number" data-act="monthly" value="'+(g.monthly||"")+'" placeholder="KES" style="width:110px"><select data-act="period" aria-label="Saving period"><option value="week"'+(g.period==="week"?" selected":"")+'>per week</option><option value="month"'+(g.period==="week"?"":" selected")+'>per month</option></select></div>';
    if(g.log&&g.log.length){h+='<details><summary>History ('+g.log.length+')</summary><div class="log">'+g.log.slice().reverse().slice(0,15).map(function(l){return'<div><span>'+fmtDate(l.d)+(l.note?' · '+esc(l.note):'')+'</span><span class="'+(l.amt<0?'neg':'')+'">'+(l.amt<0?'−':'+')+Math.abs(l.amt).toLocaleString("en-KE")+'</span></div>'}).join("")+'</div></details>';}
    h+='</section>';
  });
  return h;
}

function sortByDate(a,b){return (a.when||a.due||"9999").localeCompare(b.when||b.due||"9999")}
function schoolView(){
  var h='<form class="card" data-form="school"><div class="row"><select name="kind"><option value="assignment">Assignment</option><option value="lecture">Lecture</option></select>'+
  '<input class="grow" name="title" placeholder="Title (e.g. Pygame scene)" required><input class="grow" name="course" placeholder="Course (e.g. BIT 2301)">'+
  '<input type="date" name="when" required value="'+todayIso()+'"><button class="btn pri">Add</button></div></form>';
  var open=S.school.filter(function(x){return!x.done}).sort(sortByDate), done=S.school.filter(function(x){return x.done}).sort(sortByDate).reverse();
  if(!S.school.length)h+='<div class="empty">No lectures or assignments yet.</div>';
  function row(x){var late=!x.done&&x.when<todayIso(),t=x.when===todayIso();
    return'<div class="item'+(x.done?' done':'')+'" data-id="'+x.id+'"><input type="checkbox" data-act="toggle"'+(x.done?' checked':'')+' aria-label="Mark done">'+
    '<div class="t"><b>'+esc(x.title)+'</b><div><span class="tag '+(x.kind==="lecture"?'lec':'')+'">'+(x.kind==="lecture"?"Lecture":"Assignment")+'</span>'+(x.course?'<span class="tag">'+esc(x.course)+'</span>':'')+
    '<span class="mute">'+(t?"Today":fmtDate(x.when))+'</span>'+(late?' <span class="tag late">Overdue</span>':'')+'</div></div><button class="btn sm del" data-act="del">✕</button></div>';}
  if(open.length)h+='<div class="card">'+open.map(row).join("")+'</div>';
  if(done.length)h+='<details><summary>Completed ('+done.length+')</summary><div class="card">'+done.map(row).join("")+'</div></details>';
  return h;
}
function errandsView(){
  var h='<form class="card" data-form="errand"><div class="row"><input class="grow" name="title" placeholder="Errand (e.g. Pay Wi-Fi bill)" required><input type="date" name="due"><button class="btn pri">Add</button></div></form>';
  var open=S.errands.filter(function(x){return!x.done}).sort(sortByDate), done=S.errands.filter(function(x){return x.done});
  if(!S.errands.length)h+='<div class="empty">Nothing to run today. Add an errand above.</div>';
  function row(x){var late=!x.done&&x.due&&x.due<todayIso();
    return'<div class="item'+(x.done?' done':'')+'" data-id="'+x.id+'"><input type="checkbox" data-act="toggle"'+(x.done?' checked':'')+' aria-label="Mark done">'+
    '<div class="t"><b>'+esc(x.title)+'</b><div class="mute">'+(x.due?fmtDate(x.due):"No date")+(late?' <span class="tag late">Overdue</span>':'')+'</div></div><button class="btn sm del" data-act="del">✕</button></div>';}
  if(open.length)h+='<div class="card">'+open.map(row).join("")+'</div>';
  if(done.length)h+='<details><summary>Done ('+done.length+')</summary><div class="card">'+done.map(row).join("")+'</div></details>';
  return h;
}
var view=document.getElementById("view");
function render(){
  view.innerHTML=tab==="savings"?savingsView():tab==="school"?schoolView():errandsView();
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.setAttribute("aria-selected",b.dataset.tab===tab)});
}
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(b){tab=b.dataset.tab;render();}});

var lastKind="add";
view.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return;
  if(b.dataset.kind)lastKind=b.dataset.kind;
  var a=b.dataset.act; if(!a)return;
  var el=b.closest("[data-id]"), id=el&&el.dataset.id;
  if(a==="delgoal"){if(confirm("Delete this goal and its history?")){S.goals=S.goals.filter(function(g){return g.id!==id});save();render();}}
  if(a==="del"){var k=tab==="school"?"school":"errands";S[k]=S[k].filter(function(x){return x.id!==id});save();render();}
});
view.addEventListener("change",function(e){
  var t=e.target,a=t.dataset.act; if(!a)return;
  var el=t.closest("[data-id]"), id=el&&el.dataset.id;
  if(a==="toggle"){var k=tab==="school"?"school":"errands";S[k].forEach(function(x){if(x.id===id)x.done=t.checked});save();render();}
  if(a==="monthly"){S.goals.forEach(function(g){if(g.id===id)g.monthly=Math.max(0,parseFloat(t.value)||0)});save();render();}
  if(a==="period"){S.goals.forEach(function(g){if(g.id===id)g.period=t.value});save();render();}
});
view.addEventListener("submit",function(e){
  e.preventDefault();
  var f=e.target,type=f.dataset.form,v=function(n){return(f.elements[n]||{}).value||""};
  if(type==="goal"){S.goals.push({id:uid(),name:v("name").trim(),target:parseFloat(v("target")),saved:0,monthly:parseFloat(v("monthly"))||0,period:v("period")||"month",deadline:v("deadline"),log:[]});}
  if(type==="tx"){var id=f.closest("[data-id]").dataset.id,amt=parseFloat(v("amt"));
    S.goals.forEach(function(g){if(g.id!==id)return;var d=lastKind==="sub"?-amt:amt;if(g.saved+d<0)d=-g.saved;g.saved+=d;g.log.push({d:todayIso(),amt:d,note:v("note").trim()});});}
  if(type==="school"){S.school.push({id:uid(),kind:v("kind"),title:v("title").trim(),course:v("course").trim(),when:v("when"),done:false});}
  if(type==="errand"){S.errands.push({id:uid(),title:v("title").trim(),due:v("due"),done:false});}
  save();render();
});
render();
function valid(r){return r&&Array.isArray(r.goals)&&Array.isArray(r.school)&&Array.isArray(r.errands)}
function hasData(){return S.goals.length||S.school.length||S.errands.length}
function adopt(r){
  S={goals:r.goals,school:r.school,errands:r.errands,updated:r.updated||0};
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  var a=document.activeElement; if(a&&/INPUT|SELECT/.test(a.tagName)&&a.value&&a.closest("form"))return;
  render();
}
var AKEY="timely.avatar";
function paintAv(){
  var u=null;try{u=localStorage.getItem(AKEY)}catch(e){}
  document.getElementById("av").style.backgroundImage=u?"url("+u+")":"";
  document.getElementById("avt").style.display=u?"none":"";
  document.getElementById("avx").hidden=!u;
}
document.getElementById("av").addEventListener("click",function(){document.getElementById("avf").click()});
document.getElementById("avx").addEventListener("click",function(){try{localStorage.removeItem(AKEY)}catch(e){}paintAv()});
document.getElementById("avf").addEventListener("change",function(e){
  var f=e.target.files[0]; e.target.value=""; if(!f||!/^image\//.test(f.type))return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var N=256,c=document.createElement("canvas");c.width=c.height=N;
      var ctx=c.getContext("2d"),s=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,N,N);
      try{localStorage.setItem(AKEY,c.toDataURL("image/jpeg",0.85))}catch(err){alert("Could not save that photo. Try a smaller one.")}
      paintAv();
    };
    img.onerror=function(){alert("That file could not be read as an image.")};
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
});
paintAv();
document.getElementById("exp").addEventListener("click",function(){
  try{
    var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download="timely-backup-"+todayIso()+".json";

/* ---- Reminders ---- */
function idb(){return new Promise(function(res,rej){var r=indexedDB.open("timely",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function idbSet(k,v){return idb().then(function(db){return new Promise(function(res){var t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=res})}).catch(function(){})}
function idbGet(k){return idb().then(function(db){return new Promise(function(res){var q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){res(null)}})}).catch(function(){return null})}
function digest(S,now){
  var t=iso(now),parts=[];
  var sc=S.school.filter(function(x){return!x.done}),er=S.errands.filter(function(x){return!x.done});
  var dS=sc.filter(function(x){return x.when===t}),dE=er.filter(function(x){return x.due===t});
  var late=sc.filter(function(x){return x.when<t}).length+er.filter(function(x){return x.due&&x.due<t}).length;
  if(dS.length)parts.push(dS.map(function(x){return(x.kind==="lecture"?"Lecture: ":"Due: ")+x.title}).join(", "));
  if(dE.length)parts.push("Errands: "+dE.map(function(x){return x.title}).join(", "));
  if(late)parts.push(late+" overdue");
  var day=now.getDay(),dom=now.getDate();
  var nudge=S.goals.filter(function(g){return g.monthly>0&&g.saved<g.target&&((g.period==="week"&&day===1)||(g.period!=="week"&&dom===1))});
  if(nudge.length)parts.push("Time to save: "+nudge.map(function(g){return kes(g.monthly)+" for "+g.name}).join(", "));
  return parts.join(". ");
}
function loadR(){var d={on:false,time:"08:00",last:""};try{return Object.assign(d,JSON.parse(localStorage.getItem("timely.remind")||"{}"))}catch(e){return d}}
function saveR(R){try{localStorage.setItem("timely.remind",JSON.stringify(R))}catch(e){} idbSet("remind",R);}
function can(){return "Notification" in window&&"serviceWorker" in navigator}
function note(t){document.getElementById("remnote").textContent=t}
function paintR(){var R=loadR();document.getElementById("rem").textContent="Reminders: "+(R.on&&can()&&Notification.permission==="granted"?"on":"off");document.getElementById("remt").value=R.time}
function show(body){return navigator.serviceWorker.ready.then(function(reg){return reg.showNotification("Timely",{body:body,icon:"icons/icon-192.png",badge:"icons/icon-192.png",tag:"timely-daily"})})}
function periodic(on){if(!can())return;navigator.serviceWorker.ready.then(function(reg){if(!reg.periodicSync)return;if(on)reg.periodicSync.register("timely-daily",{minInterval:6*3600*1000}).catch(function(){});else reg.periodicSync.unregister("timely-daily").catch(function(){})})}
async function checkReminders(){
  var R=loadR(); if(!R.on||!can()||Notification.permission!=="granted")return;
  var now=new Date(),hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  var t=todayIso(); if(R.last===t||hm<R.time)return;
  var stored=await idbGet("remind"); if(stored&&stored.last===t){R.last=t;saveR(R);return}
  R.last=t; saveR(R);
  var body=digest(S,now); if(body)show(body);
}
document.getElementById("rem").addEventListener("click",function(){
  if(!can()){note("This browser does not support notifications.");return}
  var R=loadR();
  if(R.on){R.on=false;saveR(R);periodic(false);note("");paintR();return}
  Notification.requestPermission().then(function(p){
    if(p!=="granted"){note("Notifications are blocked. Allow them in the site settings of your browser, then try again.");paintR();return}
    note(""); R.on=true; R.last=todayIso(); saveR(R); periodic(true); paintR();
    var d=digest(S,new Date());
    show("Daily summary is on for "+R.time+"."+(d?" Today: "+d:" Nothing due today."));
  });
});
document.getElementById("remt").addEventListener("change",function(e){var R=loadR();R.time=e.target.value||"08:00";saveR(R)});
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkReminders()});
setInterval(checkReminders,60000);
paintR(); idbSet("state",S); idbSet("remind",loadR()); checkReminders();
})();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
